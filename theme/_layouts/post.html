---
layout: default
---

<article class="post">
  <small class="post-meta">{{ page.date | date: "%-d %B %Y" }}{% if page.author %} &middot; by {{ page.author }}{% endif %}</small>
  <h1>{{ page.title }}</h1>

  {{ content }}

  {% if page.categories.size > 0 %}
  <p class="post-tags"><small>tags: {% for c in page.categories %}<em>{{ c }}</em>{% unless forloop.last %} - {% endunless %}{% endfor %}</small></p>
  {% endif %}
</article>
